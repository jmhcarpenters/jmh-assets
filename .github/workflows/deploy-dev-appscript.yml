name: Deploy JMH DEV Apps Script

on:
  push:
    branches:
      - dev-pwa
    paths:
      - "apps-script/**"
      - ".github/workflows/deploy-dev-appscript.yml"
  workflow_dispatch:

concurrency:
  group: jmh-dev-appscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev-pwa
        uses: actions/checkout@v4
        with:
          ref: dev-pwa

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Restore Google authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON secret is missing."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Configure JMH DEV Apps Script
        working-directory: apps-script
        shell: bash
        run: |
          cat > .clasp.json <<'EOF'
          {
            "scriptId": "1oHyAZER2KDEV_jplWTRSVlB7Hxa3CbdwmoUCRgOJAIxR85q2atEaXlXn",
            "rootDir": "."
          }
          EOF

      - name: Repair standalone spreadsheet binding
        working-directory: apps-script
        shell: bash
        run: |
          echo "Replacing bound-spreadsheet calls for standalone DEV..."
          find . -type f \( -name '*.gs' -o -name '*.html' \) -print0 | \
            xargs -0 sed -i 's/SpreadsheetApp[[:space:]]*\.getActiveSpreadsheet()/getJmhSpreadsheet_()/g'
          python - <<'PY'
          from pathlib import Path
          for p in list(Path('.').glob('*.gs')) + list(Path('.').glob('*.html')):
              s = p.read_text(encoding='utf-8')
              s = s.replace('SpreadsheetApp\n    .getActiveSpreadsheet()', 'getJmhSpreadsheet_()')
              s = s.replace('SpreadsheetApp\r\n    .getActiveSpreadsheet()', 'getJmhSpreadsheet_()')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify local DEV source before push
        working-directory: apps-script
        shell: bash
        run: |
          echo "Checking repaired local source..."
          if grep -R "getActiveSpreadsheet()" --include='*.gs' --include='*.html' .; then
            echo "ERROR: DEV source still contains getActiveSpreadsheet()."
            exit 1
          fi
          echo "Verified: no bound-spreadsheet calls remain in deployment source."

      - name: Verify DEV connection
        working-directory: apps-script
        run: clasp status

      - name: Push code to Apps Script DEV
        working-directory: apps-script
        run: clasp push --force

      - name: Pull DEV source back from Google and verify
        shell: bash
        run: |
          rm -rf /tmp/jmh-dev-verify
          mkdir -p /tmp/jmh-dev-verify
          cp apps-script/.clasp.json /tmp/jmh-dev-verify/.clasp.json
          cd /tmp/jmh-dev-verify
          clasp pull
          echo "Verifying source returned by Google Apps Script..."
          if grep -R "getActiveSpreadsheet()" --include='*.gs' --include='*.html' .; then
            echo "ERROR: Google Apps Script still contains getActiveSpreadsheet() after push."
            exit 1
          fi
          if ! grep -R "function getJobs" . >/dev/null; then
            echo "ERROR: getJobs() was not returned from DEV Apps Script."
            exit 1
          fi
          if ! grep -R "getJmhSpreadsheet_" . >/dev/null; then
            echo "ERROR: explicit JMH spreadsheet binding was not returned from Google."
            exit 1
          fi
          echo "Verified: Google contains corrected standalone DEV source."

      - name: Update permanent DEV web app deployment
        working-directory: apps-script
        run: |
          clasp deploy \
            --deploymentId "AKfycbxxygi6iiboyfFuauTaeHmFfG0XNshdpLU2U6m8aL8t7LSnEdZCYivtnn0Xw3x5ZuhywA" \
            --description "Automated DEV web app deployment $GITHUB_SHA"
