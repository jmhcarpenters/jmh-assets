name: Apply dev PWA hotfixes

on:
  push:
    branches: [dev-pwa]
    paths:
      - '.github/workflows/dev-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-pwa

      - name: Replace all bound spreadsheet calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('apps-script').glob('*'):
              if path.suffix not in {'.gs', '.html'} or path.name == 'DevConfig.gs':
                  continue
              src = path.read_text(encoding='utf-8')
              fixed = src.replace('SpreadsheetApp.getActiveSpreadsheet()', 'getJmhSpreadsheet_()')
              if fixed != src:
                  path.write_text(fixed, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for p in changed:
              print(' -', p)

          leftovers = []
          for path in Path('apps-script').glob('*'):
              if path.suffix in {'.gs', '.html'}:
                  text = path.read_text(encoding='utf-8')
                  if 'SpreadsheetApp.getActiveSpreadsheet()' in text:
                      leftovers.append(str(path))
          if leftovers:
              raise SystemExit('ERROR: active-spreadsheet calls remain: ' + ', '.join(leftovers))
          PY

      - name: Verify DEV spreadsheet helper
        shell: bash
        run: |
          grep -F "SpreadsheetApp.openById(JMH_SPREADSHEET_ID)" apps-script/DevConfig.gs
          grep -R -F "getJmhSpreadsheet_()" apps-script/*.gs >/dev/null
          if grep -R -F "SpreadsheetApp.getActiveSpreadsheet()" apps-script --include='*.gs' --include='*.html'; then
            echo "Bound spreadsheet references still remain"
            exit 1
          fi

      - name: Commit repaired DEV source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/
          git commit -m "Fix DEV dropdown spreadsheet bindings"
          git push origin HEAD:dev-pwa
