name: Apply dev PWA hotfixes

on:
  push:
    branches: [dev-pwa]
    paths:
      - '.github/workflows/dev-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-pwa

      - name: Fix offline transition and cached dropdowns
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps-script/Index.html')
          s=p.read_text(encoding='utf-8')

          # Cache every populated top-level dropdown, regardless of which startup path filled it.
          s=s.replace('function populateEmployees(employees){', 'function populateEmployees(employees){cacheOfflineList("jmhEmployees",employees);')
          s=s.replace('function populateJobs(jobs){', 'function populateJobs(jobs){cacheOfflineList("jmhJobs",jobs);')
          s=s.replace('function populateCategories(categories){', 'function populateCategories(categories){cacheOfflineList("jmhCategories",categories);')

          # A request that was already in flight when airplane mode is enabled can fail after
          # navigator.onLine changes. Treat Apps Script HTTP 0 as an offline transition, not an error.
          marker='function cacheOfflineList(key,list)'
          helper='''function isOfflineTransportError(error){const text=String(error&&error.message?error.message:error||"");return !navigator.onLine||/HTTP\\s*0|NetworkError|Connection failure/i.test(text)}\nfunction handleOfflineTransportError(error){if(!isOfflineTransportError(error))return false;hideMessage();restoreOfflineUi();updateConnectionStatus();return true}\n'''
          if helper not in s and marker in s:
              s=s.replace(marker,helper+marker,1)

          # Central error display must never paint HTTP 0 red while intentionally offline.
          old='function showError(error){showMessage(error&&error.message?error.message:String(error),"error")} '
          if old in s:
              s=s.replace(old,'function showError(error){if(handleOfflineTransportError(error))return;showMessage(error&&error.message?error.message:String(error),"error")} ',1)
          else:
              s=s.replace('function showError(error){showMessage(error&&error.message?error.message:String(error),"error")}', 'function showError(error){if(handleOfflineTransportError(error))return;showMessage(error&&error.message?error.message:String(error),"error")}',1)

          # When the browser fires offline, immediately clear a stale transport error and restore cache.
          s=s.replace('window.addEventListener("offline",updateConnectionStatus);', 'window.addEventListener("offline",function(){hideMessage();restoreOfflineUi();updateConnectionStatus()});')

          # Existing startup/status failures should also route through the central transport guard.
          s=s.replace('function initialLoadFailed(error){console.error(error);if(!navigator.onLine){updateConnectionStatus();restoreOfflineUi();initialLoadFinished();return}showError(error);initialLoadFinished()}', 'function initialLoadFailed(error){console.error(error);if(handleOfflineTransportError(error)){initialLoadFinished();return}showError(error);initialLoadFinished()}')
          s=s.replace('withFailureHandler(function(error){if(!navigator.onLine){applyOfflineEmployeeStatus(employee);updateConnectionStatus();return}showError(error);showSelectEmployeeStatus()}).getEmployeeClockStatus(employee)', 'withFailureHandler(function(error){if(handleOfflineTransportError(error)){applyOfflineEmployeeStatus(employee);return}showError(error);showSelectEmployeeStatus()}).getEmployeeClockStatus(employee)')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Replace all bound spreadsheet calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('apps-script').glob('*'):
              if path.suffix not in {'.gs', '.html'} or path.name == 'DevConfig.gs': continue
              src=path.read_text(encoding='utf-8')
              fixed=src.replace('SpreadsheetApp.getActiveSpreadsheet()', 'getJmhSpreadsheet_()')
              if fixed!=src:path.write_text(fixed,encoding='utf-8')
          PY

      - name: Verify offline guards
        shell: bash
        run: |
          grep -F 'handleOfflineTransportError' apps-script/Index.html
          grep -F 'cacheOfflineList("jmhJobs",jobs)' apps-script/Index.html
          grep -F 'window.addEventListener("offline",function(){hideMessage();restoreOfflineUi();updateConnectionStatus()})' apps-script/Index.html

      - name: Commit repaired DEV source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/
          git commit -m "Fix DEV offline transition and cached dropdowns"
          git push origin HEAD:dev-pwa
