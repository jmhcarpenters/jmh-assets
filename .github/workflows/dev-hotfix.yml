name: Apply dev PWA hotfixes

on:
  push:
    branches: [dev-pwa]
    paths:
      - '.github/workflows/dev-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-pwa

      - name: Fix central offline error handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps-script/Index.html')
          s=p.read_text(encoding='utf-8')

          # The real showError signature includes buttonId. Previous hotfix missed it.
          old='function showError(error,buttonId){const message=typeof error==="string"?error:error.message||"Something went wrong.\\nAlgo salió mal.";showMessage(message,"error",buttonId)}'
          new='function showError(error,buttonId){if(handleOfflineTransportError(error))return;const message=typeof error==="string"?error:error.message||"Something went wrong.\\nAlgo salió mal.";showMessage(message,"error",buttonId)}'
          if old not in s:
              raise SystemExit('ERROR: expected showError signature not found')
          s=s.replace(old,new,1)

          # Do not make dependent dropdown server calls while offline.
          s=s.replace('function loadPhases(){const category=document.getElementById("category").value;resetDropdown("phase","Select phase / Seleccione fase");resetDropdown("task","Select task / Seleccione tarea");if(!category)return;google.script.run', 'function loadPhases(){const category=document.getElementById("category").value;resetDropdown("phase","Select phase / Seleccione fase");resetDropdown("task","Select task / Seleccione tarea");if(!category)return;if(!navigator.onLine){showMessage("Offline — reconnect to load phases. / Sin conexión — vuelva a conectarse para cargar las fases.","info");return}google.script.run')
          s=s.replace('function loadTasks(){const category=document.getElementById("category").value,phase=document.getElementById("phase").value;resetDropdown("task","Select task / Seleccione tarea");if(!category||!phase)return;google.script.run', 'function loadTasks(){const category=document.getElementById("category").value,phase=document.getElementById("phase").value;resetDropdown("task","Select task / Seleccione tarea");if(!category||!phase)return;if(!navigator.onLine){showMessage("Offline — reconnect to load tasks. / Sin conexión — vuelva a conectarse para cargar las tareas.","info");return}google.script.run')
          s=s.replace('function loadChangeOrders(selectedId){const job=document.getElementById("job").value;resetDropdown("changeOrder","Select change order / Seleccione orden de cambio");if(!job)return;google.script.run', 'function loadChangeOrders(selectedId){const job=document.getElementById("job").value;resetDropdown("changeOrder","Select change order / Seleccione orden de cambio");if(!job)return;if(!navigator.onLine){showMessage("Offline — reconnect to load change orders. / Sin conexión — vuelva a conectarse para cargar órdenes de cambio.","info");return}google.script.run')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Replace all bound spreadsheet calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('apps-script').glob('*'):
              if path.suffix not in {'.gs', '.html'} or path.name == 'DevConfig.gs': continue
              src=path.read_text(encoding='utf-8')
              fixed=src.replace('SpreadsheetApp.getActiveSpreadsheet()', 'getJmhSpreadsheet_()')
              if fixed!=src:path.write_text(fixed,encoding='utf-8')
          PY

      - name: Verify exact offline fix
        shell: bash
        run: |
          grep -F 'function showError(error,buttonId){if(handleOfflineTransportError(error))return;' apps-script/Index.html
          grep -F 'if(!navigator.onLine){showMessage("Offline — reconnect to load phases.' apps-script/Index.html
          grep -F 'window.addEventListener("offline",function(){hideMessage();restoreOfflineUi();updateConnectionStatus()})' apps-script/Index.html

      - name: Commit repaired DEV source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/
          git commit -m "Fix central HTTP 0 offline error handling"
          git push origin HEAD:dev-pwa
